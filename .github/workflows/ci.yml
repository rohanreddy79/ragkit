name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Smoke the CLI
        run: |
          uv run ragkit ingest src/ragkit/data/eval/docs --db /tmp/idx.db
          uv run ragkit query "how do I request time off" --db /tmp/idx.db -k 3
          uv run ragkit eval --no-rerank
