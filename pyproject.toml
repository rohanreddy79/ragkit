[project]
name = "ragkit"
version = "0.1.0"
description = "Hybrid retrieval-augmented generation (BM25 + dense + RRF) with a built-in evaluation loop"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Rohan Reddy Jakkam", email = "86797493+rohanreddy79@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["rag", "retrieval", "bm25", "hybrid-search", "embeddings", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "rich>=13.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.50",
]
st = [
    "sentence-transformers>=3.0",
]

[project.scripts]
ragkit = "ragkit.cli:app"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:ragkit"]
